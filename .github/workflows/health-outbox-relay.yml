name: Health outbox relay to GAS

# Claude Code の Routine（クラウドサンドボックス）は script.google.com への
# outbound がプロキシに 403 で拒否される（YouTubeのegress blockと同種の制限）。
# そのためRoutineは直接GASを叩かず、_outbox/health/ にJSONを書き込むだけにし、
# ここ（GitHub Actions、通常のネットワークアクセスを持つ）が代わりにGASへPOSTする。
#
# okkun-brain（非公開）はActions無料枠を使い切っていてstartup_failureになった
# ため、Actions無制限のpublicリポジトリであるこのtrainingに置いている。

"on":
  push:
    paths:
      - "_outbox/health/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post pending health entries to GAS
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in _outbox/health/*.json; do
            found=1
            echo "Posting $f"
            curl -sS -L --max-time 30 -X POST \
              "https://script.google.com/macros/s/AKfycbz8Fs3FTYIgGdKUhmWMH5_tseJgzhCMKNsmezl-Q4Z3JFrtvdxiRk_24Pfis_gZo-Co4g/exec" \
              -H "Content-Type: application/json" \
              --data-binary @"$f" \
              -o /tmp/resp.txt -w "HTTP:%{http_code}\n" || true
            cat /tmp/resp.txt || true
            rm -f "$f"
          done
          if [ "$found" = "0" ]; then
            echo "No pending health outbox files."
          fi

      - name: Commit outbox cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A _outbox/health
          git diff --cached --quiet || git commit -m "chore: clear processed health outbox"
          git push
